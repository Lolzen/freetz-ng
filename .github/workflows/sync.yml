name: Sync Fork with Upstream

# Täglich automatisch (nachts) + jederzeit manuell auslösbar
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Standard GITHUB_TOKEN reicht zum Pushen in den eigenen Fork
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Git-Identität setzen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Upstream-Remote hinzufügen
        run: |
          git remote add upstream https://github.com/freetz-ng/freetz-ng.git || true
          git fetch upstream

      - name: Upstream-Änderungen mergen
        run: |
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          echo "Aktueller Branch: $BRANCH"
          git merge upstream/master --no-edit || {
            echo "::error::Merge-Konflikt - bitte manuell auflösen (z.B. wegen eigener .config-Änderungen)."
            exit 1
          }

      - name: Änderungen pushen
        run: git push origin HEAD
